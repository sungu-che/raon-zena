[package]
name = "zena-lexicon-cli"
description = "Edit Raon Zena's word dictionary in LanceDB: import / export the bias.json form, add or remove phrases and lines, search, learned candidates, revisions and rollback, SigLIP2 anchors"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zena-lexicon"
path = "src/main.rs"

[dependencies]
zena-lexicon = { path = "../../crates/zena-lexicon", features = ["lancedb"] }
raon-vision = { path = "../../crates/raon-vision" }
raon-infer = { path = "../../crates/raon-infer" }
anyhow = "1"
serde_json.workspace = true

[features]
default = []
cuda = ["raon-infer/cuda", "raon-vision/cuda"]
rocm = ["raon-infer/rocm", "raon-vision/rocm"]
vulkan = ["raon-infer/vulkan", "raon-vision/vulkan"]
metal = ["raon-infer/metal", "raon-vision/metal"]
flash-attn = ["raon-infer/flash-attn"]
