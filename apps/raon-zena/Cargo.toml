[package]
name = "raon-zena"
description = "KRAFTON Raon Zena – Windows overlay client (winit + wgpu + windows-rs)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
raon-cpu-kernels.workspace = true
zena-core = { path = "../../crates/zena-core" }
zena-verdict = { path = "../../crates/zena-verdict" }
premium-discount-identity.workspace = true
premium-discount-mcp.workspace = true
premium-discount-nav.workspace = true
premium-discount-schema.workspace = true
premium-discount-filter.workspace = true
premium-discount-relay.workspace = true
premium-discount-window = { workspace = true, features = ["win32"] }
nlp-nms-router = { path = "../../crates/nlp-nms-router" }
raon-quant = { path = "../../crates/raon-quant" }
raon-infer = { path = "../../crates/raon-infer" }
raon-vision = { path = "../../crates/raon-vision" }
zena-lexicon = { path = "../../crates/zena-lexicon" }
zena-avatar-mcp = { path = "../../crates/zena-avatar-mcp" }
zena-sds = { path = "../../crates/zena-sds" }
serde.workspace = true
serde_json.workspace = true
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
wgpu = "30"
winit = "0.30"

[features]
default = ["lexicon-db", "nlp"]
# NLP-NMS v2: Stanza roles (ONNX Runtime, loaded at run time) + granite embeddings + SDS, when the models are installed.
nlp = ["nlp-nms-router/stanza"]
# The word dictionary in LanceDB (hot reload, learning, anchors). Without it the JSON dictionary is used as is.
lexicon-db = ["zena-lexicon/lancedb"]
# LLM / screen-encoder acceleration backends (candle-rocm-vulkan fork), same switches as Qntology/logis-center.
cuda = ["raon-infer/cuda", "raon-vision/cuda"]
rocm = ["raon-infer/rocm", "raon-vision/rocm"]
vulkan = ["raon-infer/vulkan", "raon-vision/vulkan"]
metal = ["raon-infer/metal", "raon-vision/metal"]
flash-attn = ["raon-infer/flash-attn"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
