[package]
name = "raon-vision"
description = "Raon Zena screen encoder: premium-discount-vision (SigLIP2 So400m NaFlex, Raon-VE and google SigLIP2) re-exported, with the word dictionary's vision nodes as anchor-bank domains"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lv-screen.workspace = true
zena-lexicon = { path = "../zena-lexicon" }
anyhow = "1"

[features]
default = []
cuda = ["lv-screen/cuda"]
rocm = ["lv-screen/rocm"]
vulkan = ["lv-screen/vulkan"]
metal = ["lv-screen/metal"]
