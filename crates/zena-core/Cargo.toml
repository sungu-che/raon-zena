[package]
name = "zena-core"
description = "Raon Zena core: screen-space polar geometry, reaction routing, tool-call schema, avatar/window control"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Screen geometry (BBox, Polar, flow) lives in premium-discount-sensor
premium-discount-sensor.workspace = true
# Window style bits, viewport, hover alpha, frame budget (shared with premium-discount-app's overlay)
premium-discount-window.workspace = true
# 언어팩 (페르소나 · 프롬프트 틀 · 큐 대사) 과 코스 줄의 추천 말투
zena-locale = { path = "../zena-locale" }
zena-verdict = { path = "../zena-verdict" }
serde.workspace = true
serde_json.workspace = true
