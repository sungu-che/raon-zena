[workspace]
resolver = "2"
members = [
    "crates/zena-core",
    "crates/raon-quant",
    "crates/nlp-nms-router",
    "crates/raon-infer",
    "crates/zena-lexicon",
    "crates/raon-vision",
    "crates/zena-avatar-mcp",
    "crates/zena-sds",
    "crates/zena-verdict",
    "crates/zena-locale",
    "apps/raon-zena",
    "apps/zena-lexicon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sungu-che/raon-zena"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
half = "2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
# premium-discount's library crates (`crates/` of github.com/Qntology/premium-discount, all named
# premium-discount-*): identity (hashId, wallet), verdict (PD-Verdict), nav (accessibility numbering), schema (cc, to / bcc,
# the app's command contract), filter (dictionary profanity filter), mcp-protocol (the stdio MCP framing, re-exported as
# zena_avatar_mcp::protocol), mcp (premium-discount-mcp: the MCP server and PdSyncClient / SyncLoop), sds (Welford and scope
# backoff), manifest (pinned-download checks). None depends on LanceDB, Tauri, tokio or a model runtime, so they link into
# this workspace (LanceDB 0.41) as they do into premium-discount-app (0.31).
# Pinned by revision; to build against a checkout next to this one, uncomment the [patch] section at the end.
premium-discount-identity = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-verdict = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-nav = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-schema = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-filter = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-mcp-protocol = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-mcp = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-sds = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-manifest = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-sensor = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-nlp = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660", default-features = false }
premium-discount-nms = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
# Window math is used without its Win32 lookup (feature `win32`); turn it on where an app needs it
premium-discount-window = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660", default-features = false }
premium-discount-relay = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-quant = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }
premium-discount-vision = { git = "https://github.com/Qntology/premium-discount", rev = "bb51311967b5d936a9dd6729a1e5747e9d2f3660" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
# Dependencies carry no debug info in dev builds: the LanceDB tree (lance, arrow, datafusion) is large.
debug = false

# LLM acceleration: the candle-rocm-vulkan fork (CUDA / ROCm-HIP / Vulkan / Metal backends, fused
# attention, TurboQuant), wired exactly like Qntology/logis-center. The fork tracks candle 0.11.0 and
# replaces the crates.io candle-core / candle-nn. Pinned to the same commit as premium-discount (crates/ and app/),
# so both workspaces build one candle. To build against a local checkout, swap the git lines for
# `path = "../candle-rocm-vulkan/candle-core"` etc.
[patch.crates-io]
candle-core = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "ebaf93db065f22be67a9a4a250eec5a212e143fe" }
candle-nn = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "ebaf93db065f22be67a9a4a250eec5a212e143fe" }

[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.raon-quant]
opt-level = 3
[profile.dev.package.raon-vision]
opt-level = 3
[profile.dev.package.premium-discount-sensor]
opt-level = 3

