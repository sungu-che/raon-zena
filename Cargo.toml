[workspace]
resolver = "2"
members = [
    "crates/zena-core",
    "crates/raon-cpu-kernels",
    "crates/raon-quant",
    "crates/nlp-nms-router",
    "crates/raon-infer",
    "crates/zena-lexicon",
    "crates/raon-vision",
    "crates/zena-avatar-mcp",
    "crates/zena-sds",
    "crates/zena-verdict",
    "apps/raon-zena",
    "apps/zena-lexicon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sungu-che/raon-zena"

[workspace.dependencies]
raon-cpu-kernels = { path = "crates/raon-cpu-kernels" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
half = "2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
# premium-discount's library crates (`crates/` of github.com/Qntology/premium-discount, all named
# premium-discount-*): identity (hashId, wallet), verdict (PD-Verdict), nav (accessibility numbering), schema (cc, to / bcc,
# the app's command contract), filter (dictionary profanity filter), mcp-protocol (the stdio MCP framing, re-exported as
# zena_avatar_mcp::protocol), mcp (premium-discount-mcp: the MCP server and PdSyncClient / SyncLoop), sds (Welford and scope
# backoff), manifest (pinned-download checks). None depends on LanceDB, Tauri, tokio or a model runtime, so they link into
# this workspace (LanceDB 0.41) as they do into premium-discount-app (0.31).
# The screen geometry (BBox, Polar, flow) and the screen kind (VisionKind) are model-free and live in premium-discount-sds
# (`geometry`); the screen sensor, NaFlex patches and the SigLIP2 screen encoder are louis-vision's `lv-screen` (Tier 1),
# pinned below to the revision that pins this premium-discount revision, so both resolve one premium-discount-sds.
# Pinned by revision; to build against a checkout next to this one, uncomment the [patch] section at the end.
premium-discount-identity = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-verdict = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-nav = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-schema = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-filter = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-mcp-protocol = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-mcp = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-sds = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-manifest = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-nlp = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6", default-features = false }
premium-discount-nms = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
# Window math is used without its Win32 lookup (feature `win32`); turn it on where an app needs it
premium-discount-window = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6", default-features = false }
premium-discount-relay = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
premium-discount-quant = { git = "https://github.com/Qntology/premium-discount", rev = "7810fdc8c145fa7b5ca28d32d21f8528dddfb3b6" }
# louis-vision Tier 1 screen vision (LogLumSensor, ROI tracker, NaFlex, SigLIP2 screen encoder, anchor bank, perforated pass)
lv-screen = { git = "https://github.com/Qntology/louis-vision", rev = "a2dd50a682720c622db76450c003b3ffd6785644" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# zena-avatar-mcp (mesh/service) and raon-infer accel_check use catch_unwind to isolate panics cleanly.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
# Dependencies carry no debug info in dev builds: the LanceDB tree (lance, arrow, datafusion) is large.
debug = false

# LLM acceleration: the candle-rocm-vulkan fork (CUDA / ROCm-HIP / Vulkan / Metal backends, fused
# attention, TurboQuant), wired exactly like Qntology/logis-center. The fork tracks candle 0.11.0 and
# replaces the crates.io candle-core / candle-nn. Pinned to the same commit as premium-discount (crates/ and app/),
# so both workspaces build one candle. To build against a local checkout, swap the git lines for
# `path = "../candle-rocm-vulkan/candle-core"` etc.
[patch.crates-io]
candle-core = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }
candle-nn = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }

[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.raon-cpu-kernels]
opt-level = 3
[profile.dev.package.raon-infer]
opt-level = 3
[profile.dev.package.raon-quant]
opt-level = 3
[profile.dev.package.raon-vision]
opt-level = 3
[profile.dev.package.lv-screen]
opt-level = 3

